# GPT(OpenAI)로 판단·개별 기능. 키는 환경 변수로만 (레포에 넣지 않기).
# 2026-11-04 진행 님 결정: Gemini 무료 등급이 하루 20번이라 막혔고, OpenAI 크레딧이 있어 GPT로 바꿈(Gemini는 agent에서 뺌).
spring:
  ai:
    model:
      chat: openai
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          # 실제 키로 속도·판단을 재고 정함(25초 제한 안, 판단이 맞는지). 바꾸려면 AGENT_OPENAI_MODEL.
          model: ${AGENT_OPENAI_MODEL:gpt-5-mini}

agent:
  judge: openai
